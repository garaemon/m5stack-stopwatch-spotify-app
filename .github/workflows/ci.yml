name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy
          python -m pip install ruff platformio
      - name: Check C++ formatting
        run: git ls-files -- '*.h' '*.cpp' | xargs clang-format --dry-run --Werror
      - name: Check Python
        run: |
          ruff check tools
          ruff format --check tools
      - name: Fetch native dependencies
        run: pio pkg install -e native
      - name: Run clang-tidy on the core library
        run: |
          clang-tidy lib/core/src/*.cpp -- -std=c++17 \
            -I lib/core/src -I .pio/libdeps/native/ArduinoJson/src

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Run native tests
        run: pio test -e native

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Create placeholder secrets
        run: cp include/secrets.h.example include/secrets.h
      - name: Build firmware
        run: pio run -e stopwatch
